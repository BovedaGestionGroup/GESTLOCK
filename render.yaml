services:
  - type: web
    name: gestor-web
    env: node
    plan: free
    rootDir: .
    buildCommand: npm ci --include=dev && npm run build --workspace apps/web
    startCommand: npm run start --workspace apps/web
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://gestor-api-vjy0.onrender.com

  - type: web
    name: gestor-api
    env: node
    plan: free
    rootDir: .
    healthCheckPath: /health
    buildCommand: npm ci --include=dev && npx prisma generate --schema apps/api/prisma/schema.prisma && npm run build --workspace apps/api
    startCommand: npm run db:push --workspace apps/api && npm run start --workspace apps/api
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: gestor-db
          property: connectionString
      # ─── Secretos criptográficos ─────────────────────────────────────────────
      # sync: false → Render obliga a introducirlos manualmente en el panel.
      # Sus valores NUNCA se guardan en este archivo ni en el repositorio.
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: VAULT_MASTER_SECRET
        sync: false
      # ─── URLs de la aplicación ───────────────────────────────────────────────
      - key: FRONTEND_URL
        value: https://gestor-web-ikec.onrender.com
      - key: APP_URL
        value: https://gestor-web-ikec.onrender.com

databases:
  - name: gestor-db
    plan: free
    databaseName: gestor_db
    user: gestor_user
